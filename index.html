<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="kompi — prosty kompilator C++ online dla uczniów. Pisz, uruchamiaj i udostępniaj kod jednym linkiem." />
    <title>kompi — kompilator C++ online</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://emkc.org" />
  </head>
  <body>
    <!-- ====================== ikony (sprite SVG) ====================== -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display: none" aria-hidden="true">
      <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" stroke="none"/></symbol>
      <symbol id="i-share" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.5 13.5a4 4 0 0 0 6 .5l2.5-2.5a4 4 0 0 0-5.7-5.7L12 7"/>
        <path d="M13.5 10.5a4 4 0 0 0-6-.5L5 12.5a4 4 0 0 0 5.7 5.7L12 17"/>
      </symbol>
      <symbol id="i-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z"/>
        <circle cx="9.2" cy="11.5" r="1" fill="currentColor" stroke="none"/>
        <circle cx="12.5" cy="11.5" r="1" fill="currentColor" stroke="none"/>
        <circle cx="15.8" cy="11.5" r="1" fill="currentColor" stroke="none"/>
      </symbol>
      <symbol id="i-brush" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18.4 3.6a2 2 0 0 1 2.8 2.8l-7.1 7.1-3.6.8.8-3.6 7.1-7.1Z"/>
        <path d="M9.8 13.2c-1.6-.5-3.2.2-4 1.7-.6 1.1-.7 2.4-2.3 3.6 1.7 1.9 5.5 2.6 7.4.3 1-1.2 1.1-3 .3-4.3"/>
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 14.5a1.3 1.3 0 0 0 .3 1.5l.1.1a1.6 1.6 0 1 1-2.3 2.3l-.1-.1a1.3 1.3 0 0 0-1.5-.3 1.3 1.3 0 0 0-.8 1.2v.3a1.6 1.6 0 1 1-3.2 0V19a1.3 1.3 0 0 0-.9-1.2 1.3 1.3 0 0 0-1.5.3l-.1.1a1.6 1.6 0 1 1-2.3-2.3l.1-.1a1.3 1.3 0 0 0 .3-1.5 1.3 1.3 0 0 0-1.2-.8h-.3a1.6 1.6 0 1 1 0-3.2H5a1.3 1.3 0 0 0 1.2-.9 1.3 1.3 0 0 0-.3-1.5l-.1-.1a1.6 1.6 0 1 1 2.3-2.3l.1.1a1.3 1.3 0 0 0 1.5.3h.1a1.3 1.3 0 0 0 .8-1.2v-.3a1.6 1.6 0 1 1 3.2 0V5a1.3 1.3 0 0 0 .8 1.2 1.3 1.3 0 0 0 1.5-.3l.1-.1a1.6 1.6 0 1 1 2.3 2.3l-.1.1a1.3 1.3 0 0 0-.3 1.5v.1a1.3 1.3 0 0 0 1.2.8h.3a1.6 1.6 0 1 1 0 3.2H19a1.3 1.3 0 0 0-1.2.8Z"/>
      </symbol>
      <symbol id="i-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7"/></symbol>
      <symbol id="i-layout-h" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></symbol>
      <symbol id="i-layout-v" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></symbol>
      <symbol id="i-spark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M18.4 5.6l-2.8 2.8M8.4 15.6l-2.8 2.8"/></symbol>
      <symbol id="i-terminal" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 4.5 4.5L5 16M12.5 16H19"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V7l-4-4Z"/><path d="M14 3v4h4"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></symbol>
      <symbol id="i-history" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3.2 2"/></symbol>
      <symbol id="i-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 19h14"/></symbol>
      <symbol id="i-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 19h14"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M10 11v6M14 11v6"/></symbol>
    </svg>

    <div id="app">
      <!-- ====================== górny pasek ====================== -->
      <header class="topbar">
        <button id="btn-brand-kompi" class="brand" type="button" data-i18n-title="brand.tooltip">
          <span class="brand-mark" id="brand-mascot-slot"></span>
          <span class="brand-text">
            <strong>kompi</strong>
          </span>
        </button>

        <div class="topbar-center">
          <button id="btn-run" class="btn btn-run" data-i18n-title="run.tooltip">
            <svg class="i"><use href="#i-play" /></svg>
            <span data-i18n="run">Uruchom</span>
          </button>
          <button id="btn-stop" class="btn btn-stop is-hidden">
            <svg class="i"><use href="#i-stop" /></svg>
            <span data-i18n="stop">Zatrzymaj</span>
          </button>
        </div>

        <div class="topbar-actions">
          <button id="btn-share" class="btn btn-share" data-i18n-title="share.tooltip">
            <svg class="i"><use href="#i-share" /></svg>
            <span class="hide-sm" data-i18n="share">Udostępnij</span>
          </button>
          <button id="btn-glossary" class="icon-btn" data-i18n-title="glossary.tooltip" aria-label="Czat z Kompim">
            <svg class="i"><use href="#i-book" /></svg>
          </button>
          <button id="btn-appearance" class="icon-btn" data-i18n-title="appearance.tooltip" aria-label="Wygląd">
            <svg class="i"><use href="#i-brush" /></svg>
          </button>
          <button id="btn-settings" class="icon-btn" data-i18n-title="settings.tooltip" aria-label="Ustawienia">
            <svg class="i"><use href="#i-gear" /></svg>
          </button>
        </div>
      </header>

      <!-- ====================== baner pracy z linku ====================== -->
      <div id="shared-banner" class="banner is-hidden">
        <svg class="i"><use href="#i-file" /></svg>
        <span id="shared-banner-text"></span>
        <button id="shared-banner-new" class="btn btn-mini" data-i18n="banner.newWork">Zacznij własny kod</button>
        <button id="shared-banner-close" class="icon-btn-sm" aria-label="×"><svg class="i"><use href="#i-close" /></svg></button>
      </div>

      <!-- ====================== główny obszar: Kod + Wyjście ====================== -->
      <main id="split" class="split split-row">
        <section class="pane pane-editor" id="pane-editor">
          <div class="pane-head">
            <span class="pane-label" data-i18n="pane.code">Kod</span>
            <input
              id="code-title-input"
              class="code-title-input"
              type="text"
              value="przyklad.cpp"
              maxlength="40"
              spellcheck="false"
              autocomplete="off"
              data-i18n-title="saved.titleTooltip"
            />
            <div class="spacer"></div>
            <div class="pane-head-actions">
              <button
                id="btn-upload-cpp"
                class="icon-btn icon-btn-pane"
                type="button"
                data-i18n-title="saved.uploadTooltip"
                aria-label="Wczytaj .cpp"
              >
                <svg class="i"><use href="#i-upload" /></svg>
              </button>
              <input id="file-upload-cpp" type="file" accept=".cpp,.cc,.cxx,.c,.h,.hpp,.txt" hidden />
              <button
                id="btn-saved-list"
                class="icon-btn icon-btn-pane"
                type="button"
                data-i18n-title="saved.listTooltip"
                aria-label="Ostatnie kody"
              >
                <svg class="i"><use href="#i-history" /></svg>
              </button>
            </div>
          </div>
          <div id="editor" class="editor-host"></div>
        </section>

        <div class="splitter" id="splitter" role="separator" tabindex="0" aria-label="resize"></div>

        <section class="pane pane-output" id="pane-output">
          <div class="pane-head">
            <div class="tabs" role="tablist" aria-label="Wyjście / Wejście">
              <button type="button" class="tab is-active" id="tab-output" role="tab" aria-selected="true">
                <svg class="i"><use href="#i-terminal" /></svg>
                <span data-i18n="tab.output">Wyjście</span>
              </button>
              <button type="button" class="tab" id="tab-input" role="tab" aria-selected="false">
                <svg class="i"><use href="#i-download" /></svg>
                <span data-i18n="tab.input">Wejście</span>
              </button>
            </div>
            <div class="spacer"></div>
            <span id="run-status" class="run-status"></span>
          </div>
          <div id="output" class="output" tabindex="0"></div>
          <div id="input-panel" class="input-panel is-hidden">
            <textarea
              id="stdin-input"
              class="stdin-area"
              spellcheck="false"
              autocomplete="off"
              data-i18n-placeholder="stdin.placeholder"
              data-i18n-title="stdin.hint"
              placeholder="Dane wejściowe dla cin (np. 5 7)…"
            ></textarea>
            <div class="stdin-hint" data-i18n="stdin.hint">
              Tu wpisz dane, które program wczyta przez cin (każda wartość w nowej linii lub po spacji).
            </div>
          </div>
          <div class="kompi-disclaimer" data-i18n="kompi.disclaimer">Kompi może popełniać błędy.</div>
        </section>
      </main>
    </div>

    <!-- ====================== szuflada boczna ====================== -->
    <div class="drawer-scrim is-hidden" id="drawer-scrim"></div>
    <aside class="drawer is-hidden" id="drawer" aria-hidden="true">
      <div class="drawer-head">
        <h2 id="drawer-title">—</h2>
        <button class="icon-btn" id="drawer-close" aria-label="×"><svg class="i"><use href="#i-close" /></svg></button>
      </div>
      <div class="drawer-body" id="drawer-body"></div>
    </aside>

    <!-- ====================== modal + toasty ====================== -->
    <div class="modal-scrim is-hidden" id="modal-scrim">
      <div class="modal" id="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
          <h2 id="modal-title">—</h2>
          <button class="icon-btn" id="modal-close" aria-label="×"><svg class="i"><use href="#i-close" /></svg></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
    <div class="toasts" id="toasts"></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
